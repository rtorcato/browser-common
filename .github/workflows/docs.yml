name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'src/**'
      - 'scripts/sync-changelog.mjs'
      - '.github/workflows/docs.yml'
      - 'pnpm-workspace.yaml'
  # The changelog page is built from GitHub Releases, and no release commit
  # lands on main any more — without this the page would never refresh.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # https://docs.torcato.dev/browser-common/
  cloudflare:
    permissions:
      contents: read
    uses: rtorcato/repo-tooling/.github/workflows/docs-deploy-cloudflare.yml@75b34fe7d8898772cd748d1b48c698bd89cfd956 # main as of 2026-09-30
    with:
      build-filter: '@rtorcato/browser-common-docs'
      worker-name: browser-common-docs
      base-path: /browser-common/
      route: docs.torcato.dev/browser-common/*
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
