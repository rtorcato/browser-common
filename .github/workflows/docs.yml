name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'src/**'
      - 'scripts/sync-changelog.mjs'
      - '.github/workflows/docs.yml'
      - 'pnpm-workspace.yaml'
  # release.yml dispatches this after a publish, so the changelog page (built
  # from the GitHub releases) picks up the new ones.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # https://docs.torcato.dev/browser-common/
  cloudflare:
    permissions:
      contents: read
    uses: rtorcato/repo-tooling/.github/workflows/docs-deploy-cloudflare.yml@863492b9f3b85c60085a8435b372990ffc755b68 # main as of 2026-09-30
    with:
      build-filter: '@rtorcato/browser-common-docs'
      worker-name: browser-common-docs
      base-path: /browser-common/
      route: docs.torcato.dev/browser-common/*
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
