packages:
  # The root is the published package. Unlisted, Changesets cannot see it and
  # rejects every changeset as "not in the workspace".
  - '.'
  - 'apps/*'

allowBuilds:
  '@biomejs/biome': true
  core-js: false
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@rtorcato/*'
  - '@types/node@25.9.3'
verifyDepsBeforeRun: false
overrides:
  'serialize-javascript@<7.1.3': '^7.1.3'
  'browserslist@<4.28.7': '^4.28.7'
  undici@>=4 <6.29.1: '>=6.29.1 <7'
  undici@>=7 <7.30.1: '>=7.30.1 <8'
  nanoid@>=3 <3.3.18: '>=3.3.18 <4'
  nanoid@>=5 <5.1.16: '>=5.1.16 <6'
  brace-expansion@>=1 <1.1.21: '>=1.1.21 <2'
  brace-expansion@>=5 <5.0.12: '>=5.0.12 <6'
  qs@<6.16.1: '>=6.16.1 <7'
  fast-uri: '^3.1.9'
  js-yaml: '^4.3.1'
  'svgo@>=3 <3.3.5': '>=3.3.5 <4'
  'uuid@<11.1.1': '^11.1.1'
  'postcss@<8.5.23': '^8.5.23'
  'colord@<2.9.4': '^2.9.4'
  'markdown-it@<14.3.3': '^14.3.3'
  'image-size@<2.0.3': '^2.0.3'
  'handlebars@<4.7.10': '^4.7.10'
  'tinypool@<2.1.2': '^2.1.2'
  'proxy-addr@<2.0.8': '^2.0.8'
  'shell-quote@<1.11.0': '^1.11.0'
  'compression@<1.8.2': '^1.8.2'
  'http-cache-semantics@<=4.2.0': '^4.3.0'
  'source-map-js@<1.2.2': '^1.2.2'
  'postcss-selector-parser@>=7 <7.1.6': '^7.1.6'
  'postcss-selector-parser@>=6 <6.1.5': '>=6.1.5 <7'
  'follow-redirects@<1.16.2': '^1.16.2'
  'launch-editor@<2.14.2': '^2.14.2'
  'zod@>=4 <4.6.6': '>=4.6.6 <5'
  'body-parser@>=1 <1.20.9': '>=1.20.9 <2'
  'joi@>=17 <17.13.9': '>=17.13.9 <18'
